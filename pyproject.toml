[project]
name = "anime-graphrag"
version = "0.1.0"
description = "GraphRAG sur un corpus d'anime : knowledge graph Neo4j et recherche vectorielle, avec routage par LLM"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.20",
    "openai>=1.40",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    "streamlit>=1.35",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
